resources:
  jobs:
    Hotel_Bookings_BSG_Job:
      name: Hotel Bookings BSG Job
      tasks:
      - task_key: bronze_layer_ingestion
        run_job_task:
          job_id: ${resources.jobs.Bronze_Layer_Ingestion_Job.id}

      - task_key: silver_layer_transformation
        depends_on:
          - task_key: bronze_layer_ingestion
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_dlt_silver_layer.id}
          full_refresh: false

      - task_key: gold_layer_info
        depends_on:
          - task_key: silver_layer_transformation
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_dlt_gold_layer.id}
          full_refresh: false

      queue:
        enabled: true