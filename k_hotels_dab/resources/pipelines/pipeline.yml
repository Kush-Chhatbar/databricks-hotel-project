resources:
  pipelines:
    pipeline_dlt_silver_layer:
      name: DLT_SILVER_LAYER
      libraries:
        - file:
            path: ${workspace.file_path}/src/DLT_SILVER_LAYER/silver_layer_pipeline.py
      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: workspace
      serverless: true
      root_path: ${workspace.file_path}/src/DLT_SILVER_LAYER/silver_layer_pipeline.py
    
    pipeline_dlt_gold_layer:
      name: DLT_GOLD_LAYER
      libraries:
        - glob:
            include: ../../src/DLT_GOLD_LAYER/transformations/**
      schema: gold
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: workspace
      serverless: true
      root_path: ../../src/DLT_GOLD_LAYER
