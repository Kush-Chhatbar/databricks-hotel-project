# This is a Declarative Automation Bundle definition for k_hotels_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: k_hotels_dab
  uuid: 8b89c2ce-7716-4b73-acf7-a9dafe6934b1

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      source_linked_deployment: false
    workspace:
      host: https://dbc-1e6f6e1b-d8fc.cloud.databricks.com
    variables:
      catalog: hotel_project
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    presets:
      name_prefix: prod_
      source_linked_deployment: false
    workspace:
      host: https://dbc-1e6f6e1b-d8fc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kushc@200oksolutions.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kushc@200oksolutions.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hotel_project
      schema: prod
    permissions:
      - user_name: kushc@200oksolutions.com
        level: CAN_MANAGE
