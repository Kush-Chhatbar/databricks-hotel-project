
name: CI/CD - Databricks Hotel Project

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: RUN PYTEST
  # ==========================================
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: k_hotels_dab

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java for local Spark tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install pyspark==3.5.0

      - name: Run all tests
        run: |
          python -m pytest tests/ -v --tb=short


  # ==========================================
  # JOB 2: DEPLOY TO DATABRICKS PRODUCTION
  # ==========================================
deploy:
  name: Deploy Databricks Production
  runs-on: ubuntu-latest
  needs: test

  if: >
    github.event_name == 'push' &&
    github.ref == 'refs/heads/main'

  environment: production

  defaults:
    run:
      working-directory: k_hotels_dab

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Databricks CLI
      uses: databricks/setup-cli@main

    - name: Validate production bundle
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        databricks bundle validate -t prod

    - name: Deploy production bundle
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        databricks bundle deploy -t prod
